function project(x,y,z){const u=x*right[0]+z*right[1],v=y*cv-(x*depth[0]+z*depth[1])*sv;return [W*.5+(u/projW)*W+shiftX,H*.49-(v/projH)*H+shiftY];}
function screenPoly(i){const x=-2.62+(i%4)*1.52,z=-1.92+Math.floor(i/4)*1.52;return [project(x,.44,z),project(x+1.34,.44,z),project(x+1.34,.44,z+1.34),project(x,.44,z+1.34)];}
function contains(x,y,p){let inside=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])inside=!inside}return inside}
let needsStatic=true,needsDynamic=true,lastCropUpdate=0,lastSoftPaint=0;
function frame(time){resize();projW=(W>=H?19.8:17.3)/zoom;projH=projW*(H/W);
 if(needsStatic){upload(fixed,sceneStatic());needsStatic=false;needsDynamic=true;}
 if(needsDynamic||time-lastCropUpdate>1000){upload(moving,sceneCrops());needsDynamic=false;lastCropUpdate=time;}
 if(soft){if(time-lastSoftPaint>65){drawSoft();lastSoftPaint=time;}}
 else{gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.uniform1f(uni.halfW,projW/2);gl.uniform1f(uni.halfH,projH/2);
 gl.uniform2f(uni.shift,shiftX/W*2,-shiftY/H*2+.02);
 gl.uniform2f(uni.right,right[0],right[1]);gl.uniform2f(uni.depth,depth[0],depth[1]);gl.uniform1f(uni.sine,sv);gl.uniform1f(uni.cos,cv);
 assign(fixed);assign(moving);}
 requestAnimationFrame(frame);
}
let toastTimeout;function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('toast').classList.remove('show'),1700)}
function sparkleAt(x,y){for(let j=0;j<7;j++){const el=document.createElement('span');el.className='sparkle';el.textContent=['✨','🪙','✦','🌟'][j%4];el.style.left=x+'px';el.style.top=y+'px';let ang=j*2*Math.PI/7;el.style.setProperty('--tx',`calc(-50% + ${Math.cos(ang)*(30+j*4)}px)`);el.style.setProperty('--ty',`calc(-50% + ${Math.sin(ang)*(28+j*3)-25}px)`);$('spark').appendChild(el);setTimeout(()=>el.remove(),1100);}}
function gainXP(n){state.xp+=n;while(state.xp>=state.level*10+60){state.xp-=state.level*10+60;state.level++;state.coins+=100;toast('🎉 升级！获得 100 金币');}hud();}
function tapPlot(i,x,y){const p=state.plots[i];if(!p.unlock){const price=160+Math.max(0,i-9)*80;if(state.coins<price){toast('🔒 解锁需要 '+price+' 金币');return;}if(!confirm('花费 '+price+' 金币解锁这块农田？'))return;state.coins-=price;p.unlock=true;needsStatic=true;toast('🌱 新农田解锁成功！');}
 else if(p.seed<0){const c=CROPS[state.selected];if(state.coins<c.cost){toast('金币不足，先收获成熟作物吧');return;}state.coins-=c.cost;p.seed=state.selected;p.at=Date.now();needsDynamic=true;toast('🌱 已种植'+c.name);}
 else{const c=CROPS[p.seed],remain=c.time-(Date.now()-p.at);if(remain>0){toast(c.emoji+' 还有 '+Math.ceil(remain/1000)+' 秒成熟');return;}state.coins+=c.sell;state.total++;state.harvest[p.seed]=(state.harvest[p.seed]||0)+1;p.seed=-1;p.at=0;needsDynamic=true;gainXP(c.xp);sparkleAt(x,y);toast('🎉 收获 '+c.emoji+' +'+c.sell+' 金币');}
 save();hud();}
function hud(){$('coins').textContent=state.coins;$('level').textContent=state.level;const cap=state.level*10+60;$('xpText').textContent=state.xp+'/'+cap;$('xpBar').style.width=Math.min(100,100*state.xp/cap)+'%';$('currentSeed').textContent=CROPS[state.selected].emoji+' 当前种子：'+CROPS[state.selected].name;document.querySelectorAll('.seed').forEach((el,i)=>el.classList.toggle('active',i===state.selected));}
function drawSeeds(){$('seedStrip').innerHTML=CROPS.map((c,i)=>`<button class="seed${i===state.selected?' active':''}" data-seed="${i}"><span class="icon">${c.emoji}</span><span class="price">🪙 ${c.cost}</span></button>`).join('');}
const tasks=[{name:'丰收初体验',need:3,reward:120},{name:'快乐农场主',need:10,reward:280},{name:'云端种田达人',need:25,reward:600}];
let openPanelName='';function panel(name){openPanelName=name;const titles={shop:'🛒 种子商店',bag:'🧺 我的收获',goals:'📜 农场任务',help:'📖 游戏说明'};$('panelTitle').textContent=titles[name];let content='';if(name==='shop'){content=CROPS.map((c,i)=>`<div class="item"><div class="big">${c.emoji}</div><div class="txt"><strong>${c.name}</strong><small>种植 🪙${c.cost}　收获 🪙${c.sell}<br>成熟约 ${c.time/1000} 秒 · 经验 +${c.xp}</small></div><button class="action" data-buy="${i}">${state.selected===i?'已选中':'选择'}</button></div>`).join('')+'<div class="tip">选择种子后，点击岛上空的农田即可播种。金币会自动扣除，成熟后再次点击收获。</div>';
 }else if(name==='bag'){content=`<div class="tip"><span class="noticeLine">累计收获 ${state.total} 次</span> · 你的农场正在蓬勃生长！</div>`+CROPS.map((c,i)=>`<div class="item"><div class="big">${c.emoji}</div><div class="txt"><strong>${c.name}</strong><small>累计收获 ${(state.harvest[i]||0)} 次</small></div><span style="font-weight:900;color:#5b9773">× ${state.harvest[i]||0}</span></div>`).join('')+'<div class="sub">目前收获后自动出售换金币，后续版本会加入真正的物品仓库。</div>';
 }else if(name==='goals'){content=tasks.map((t,i)=>{const done=state.completed.includes(i),ready=state.total>=t.need;return `<div class="item"><div class="big">${done?'🏆':'🎯'}</div><div class="txt"><strong>${t.name}</strong><small>收获累计 ${Math.min(t.need,state.total)} / ${t.need} 次 · 奖励 🪙 ${t.reward}</small></div><button class="action" data-claim="${i}" ${(!ready||done)?'disabled':''}>${done?'已领取':ready?'领取':'进行中'}</button></div>`}).join('');
 }else{content=`<div class="tip"><strong>☁️ 欢迎来到梦幻空岛！</strong><br>① 点击下方种子，再点击空农田播种。<br>② 成熟后点击作物收获金币和经验。<br>③ 灰绿色农田可以花金币解锁。<br>④ 单指拖动平移视角，双指捏合或右侧 + / − 可放大缩小（最高 4.8×）。<br>⑤ 右侧小房子按钮恢复全景；游戏自动保存进度。<br><br>当前为手机浏览器 V8 试玩版；3D 空岛、房屋、树木等均由立体几何构成，完全离线渲染，无需加载外部 3D 素材。</div><button class="action" style="margin-top:13px" id="resetProgress">重置游戏进度</button>`;}
 $('panelBody').innerHTML=content;$('panelShade').classList.add('show');$('panel').classList.add('panelShow');}
function closePanel(){$('panelShade').classList.remove('show');$('panel').classList.remove('panelShow');openPanelName='';}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>panel(b.dataset.panel));$('closePanel').onclick=closePanel;$('panelShade').onclick=closePanel;
$('seedStrip').addEventListener('click',e=>{const button=e.target.closest('[data-seed]');if(!button)return;state.selected=+button.dataset.seed;save();hud();toast('🌱 选择了'+CROPS[state.selected].name)});
$('panelBody').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.buy!==undefined){state.selected=+b.dataset.buy;save();hud();toast('🌱 选择了'+CROPS[state.selected].name);closePanel();}if(b.dataset.claim!==undefined){const i=+b.dataset.claim;if(state.total>=tasks[i].need&&!state.completed.includes(i)){state.completed.push(i);state.coins+=tasks[i].reward;save();hud();toast('🎁 任务奖励 +'+tasks[i].reward+' 金币');panel('goals');}}if(b.id==='resetProgress'){if(!confirm('确定清空当前农场，重新开始吗？'))return;state=initial();save();needsStatic=needsDynamic=true;drawSeeds();hud();closePanel();toast('🌼 新农场已经准备好了！');}});
$('play').onclick=()=>{$('welcome').classList.add('hide');save();};
let touches=new Map(),startTouch=null,moved=false,pinchOrigin=null;
canvas.addEventListener('pointerdown',e=>{
 canvas.setPointerCapture?.(e.pointerId);
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(touches.size===1){startTouch={x:e.clientX,y:e.clientY,shiftX,shiftY};moved=false;pinchOrigin=null;}
 else if(touches.size===2){
  const a=[...touches.values()];pinchOrigin={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,shiftX,shiftY,zoom,dist:Math.max(10,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y))};moved=true;
 }
});
canvas.addEventListener('pointermove',e=>{
 if(!touches.has(e.pointerId))return;
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(touches.size===2&&pinchOrigin){
  const a=[...touches.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),centerX=(a[0].x+a[1].x)/2,centerY=(a[0].y+a[1].y)/2;
  const next=clampZoom(pinchOrigin.zoom*d/pinchOrigin.dist),ratio=next/pinchOrigin.zoom;
  shiftX=(centerX-W*.5)-(pinchOrigin.x-W*.5-pinchOrigin.shiftX)*ratio;
  shiftY=(centerY-H*.49)-(pinchOrigin.y-H*.49-pinchOrigin.shiftY)*ratio;
  zoom=next;clampCamera();updateZoomBadge();moved=true;
 }else if(touches.size===1&&startTouch){
  const dx=e.clientX-startTouch.x,dy=e.clientY-startTouch.y;
  if(Math.hypot(dx,dy)>11)moved=true;
  if(moved){shiftX=startTouch.shiftX+dx;shiftY=startTouch.shiftY+dy;clampCamera();}
 }
});
function pointerEnd(e){
 if(!touches.has(e.pointerId))return;
 touches.delete(e.pointerId);
 if(touches.size===0&&startTouch&&!moved&&!openPanelName&&$('welcome').classList.contains('hide')){
  const x=e.clientX,y=e.clientY;
  for(let i=15;i>=0;i--){if(contains(x,y,screenPoly(i))){tapPlot(i,x,y);break;}}
 }
 if(touches.size===1){const remaining=[...touches.values()][0];startTouch={x:remaining.x,y:remaining.y,shiftX,shiftY};pinchOrigin=null;moved=true;}
 else if(touches.size===0){startTouch=null;pinchOrigin=null;}
}
canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomTo(zoom*(e.deltaY>0?.90:1.11),e.clientX,e.clientY);},{passive:false});
$('cameraPlus').addEventListener('click',()=>zoomTo(zoom*1.43));
$('cameraMinus').addEventListener('click',()=>zoomTo(zoom/1.43));
$('cameraReset').addEventListener('click',()=>resetCamera());
window.addEventListener('resize',resize,{passive:true});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();$('no3d').style.display='block';});
resize();drawSeeds();hud();updateZoomBadge();requestAnimationFrame(frame);
})();
</script></body></html>
