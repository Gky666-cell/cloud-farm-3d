  const primary=stage==='idle'?`<button class="action" data-scene-action="feed">🌽 喂食 · ${FEED_COST} 金币</button>`:
     stage==='ready'?`<button class="action" data-scene-action="collect">🥚 收取 ${EGG_COUNT} 枚鸡蛋</button>`:
     `<button class="action" disabled data-scene-wait="true">🐣 产蛋中 · ${coopSecondsLeft()}秒</button>`;
  content=`<div class="sceneDockTitle">🐔 小鸡活动院 <small>3只小鸡 · 周期生产</small></div>
    <div class="sceneStatline"><span class="sceneChip">🥚 库存 ${c.eggs}</span><span class="sceneChip">✨ 累计 ${c.total}</span><span class="sceneChip">${stage==='ready'?'可以收蛋':stage==='growing'?'产蛋中':'待喂食'}</span></div>
    <div class="sceneActions">${primary}<button class="action" data-scene-action="sellEggs" ${c.eggs?'':'disabled'}>🧺 卖鸡蛋 · ${EGG_PRICE}/个</button></div>
    <div class="sceneDesc">小鸡会在院子里活动，点击小鸡或使用按钮操作。退出场景后产蛋倒计时继续。</div>`;
 }else{
  content='<div class="sceneDockTitle">🍎 果树小天地 <small>两处永久果树位 · 可反复收获</small></div><div class="scenePlotRow">';
  for(let i=0;i<ORCHARD_ROOM_SITES.length;i++){
   const t=state.orchard.trees[i],f=FRUITS[t.type],left=orchardRemaining(i);
   content+=`<div class="scenePlot${chosenTreeSlot===i?' selected':''}"><strong>🌳 果树位 ${i+1}</strong>`;
   if(!f){
    content+='<small>空地 · 选择一种树苗</small>';
    content+=FRUITS.map((v,j)=>`<button class="action" data-scene-action="plant" data-slot="${i}" data-fruit="${j}" ${state.coins<v.sapling?'disabled':''}>${v.emoji} ${v.name} ${v.sapling}金币</button>`).join('');
   }else{
    content+=`<small data-orchard-remain="${i}">${f.emoji} ${f.name}树 · ${left>0?'⏳ 还需'+left+'秒':'✨ 已经结果'}</small>`;
    content+=`<button class="action" data-scene-action="harvest" data-slot="${i}" ${left>0?'disabled':''}>${f.emoji} 采摘 ${f.count} 个</button>`;
   }
   content+='</div>';
  }
  content+='</div><div class="sceneActions">';
  for(let i=0;i<FRUITS.length;i++){
   content+=`<button class="action" data-scene-action="sellFruit" data-fruit="${i}" ${state.orchard.stock[i]?'':'disabled'}>${FRUITS[i].emoji} 出售 ×${state.orchard.stock[i]}</button>`;
  }
  content+='</div><div class="sceneDesc">树苗只需购买一次。点击果树可查看状态，成熟后可点击果树或采摘按钮，水果进入仓库。</div>';
 }
 $('sceneDockBody').innerHTML=content;el.scrollTop=oldScroll;
 el.dataset.coopStage=activeScene==='coop'?coopStage():'';
 el.dataset.orchardStages=activeScene==='orchard'?orchardSceneStates():'';
}
function orchardSceneStates(){return state.orchard.trees.map((t,i)=>t.type<0?'empty':orchardRemaining(i)>0?'growing':'ready').join(',');}
function tickSceneDock(){
 if(activeScene==='island')return;
 const el=$('sceneDock');
 if(activeScene==='coop'){
  const stage=coopStage();
  if(stage!==el.dataset.coopStage){renderSceneDock();return;}
  const wait=el.querySelector('[data-scene-wait]');
  if(wait)wait.textContent='🐣 产蛋中 · '+coopSecondsLeft()+'秒';
 }else{
  if(orchardSceneStates()!==el.dataset.orchardStages){renderSceneDock();return;}
  for(let i=0;i<state.orchard.trees.length;i++){
   const t=state.orchard.trees[i],label=el.querySelector('[data-orchard-remain="'+i+'"]');
   if(!label||t.type<0)continue;
   const left=orchardRemaining(i);
   label.textContent=FRUITS[t.type].emoji+' '+FRUITS[t.type].name+'树 · '+(left>0?'⏳ 还需'+left+'秒':'✨ 已经结果');
  }
 }
}
function sceneCanvasTap(px,py){
 if(activeScene==='coop'){
  if(hitWorldBox(px,py,-3.8,3.7,-5.8,4.1,2.6)){
   if(coopStage()==='idle')feedChickens();
   else if(coopStage()==='ready')collectEggs();
   else toast('🐣 小鸡在产蛋，还需 '+coopSecondsLeft()+' 秒');
  }
 }else if(activeScene==='orchard'){
  const i=localTreeHit(px,py);
  if(i<0)return;
  chosenTreeSlot=i;
  const t=state.orchard.trees[i];
  if(t.type<0){toast('🌱 选择下方树苗开始种植');renderSceneDock();}
  else if(orchardRemaining(i)===0)harvestFruit(i);
  else {toast('🌳 '+FRUITS[t.type].name+'树还需 '+orchardRemaining(i)+' 秒结果');renderSceneDock();}
 }
}

const tasks=[{name:'丰收初体验',need:3,reward:120},{name:'快乐农场主',need:10,reward:280},{name:'云端种田达人',need:25,reward:600}];
let openPanelName='';function panel(name){openPanelName=name;const titles={shop:'🛒 种子商店',bag:'🧺 我的收获',coop:'🐔 鸡舍经营',orchard:'🍎 果园经营',goals:'📜 农场任务',help:'📖 游戏说明'};$('panelTitle').textContent=titles[name];let content='';if(name==='shop'){content=CROPS.map((c,i)=>`<div class="item"><div class="big">${c.emoji}</div><div class="txt"><strong>${c.name}</strong><small>种植 🪙${c.cost}　收获 🪙${c.sell}<br>成熟约 ${c.time/1000} 秒 · 经验 +${c.xp}</small></div><button class="action" data-buy="${i}">${state.selected===i?'已选中':'选择'}</button></div>`).join('')+'<div class="tip">选择种子后，点击岛上空的农田即可播种。金币会自动扣除，成熟后再次点击收获。</div>';
 }else if(name==='coop'){content=coopContent();
 }else if(name==='orchard'){content=orchardContent();
 }else if(name==='bag'){content=`<div class="tip"><span class="noticeLine">累计收获 ${state.total} 次</span> · 你的农场正在蓬勃生长！</div>`+CROPS.map((c,i)=>`<div class="item"><div class="big">${c.emoji}</div><div class="txt"><strong>${c.name}</strong><small>累计收获 ${(state.harvest[i]||0)} 次</small></div><span style="font-weight:900;color:#5b9773">× ${state.harvest[i]||0}</span></div>`).join('')+`<div class="item"><div class="big">🥚</div><div class="txt"><strong>鸡蛋</strong><small>仓库 ${state.coop.eggs} 个 · 累计收集 ${state.coop.total} 个</small></div><button class="action" data-coop-action="sell" ${state.coop.eggs?'':'disabled'}>出售</button></div>${FRUITS.map((p,i)=>`<div class="item"><div class="big">${p.emoji}</div><div class="txt"><strong>${p.name}</strong><small>仓库 ${state.orchard.stock[i]} 个 · 累计采摘 ${state.orchard.total[i]} 个</small></div><button class="action" data-fruit-action="sell" data-fruit="${i}" ${state.orchard.stock[i]?'':'disabled'}>出售</button></div>`).join('')}<div class="sub">农作物收获后直接出售；鸡蛋和水果可以存入仓库，随时卖出。</div>`;
 }else if(name==='goals'){content=tasks.map((t,i)=>{const done=state.completed.includes(i),ready=state.total>=t.need;return `<div class="item"><div class="big">${done?'🏆':'🎯'}</div><div class="txt"><strong>${t.name}</strong><small>收获累计 ${Math.min(t.need,state.total)} / ${t.need} 次 · 奖励 🪙 ${t.reward}</small></div><button class="action" data-claim="${i}" ${(!ready||done)?'disabled':''}>${done?'已领取':ready?'领取':'进行中'}</button></div>`}).join('');
 }else{content=`<div class="tip"><strong>☁️ 欢迎来到梦幻空岛！</strong><br>① 点击下方种子，再点击空农田播种。<br>② 成熟后点击作物收获金币和经验。<br>③ 灰绿色农田可以花金币解锁。<br>④ 点击鸡舍可喂食小鸡、收蛋并出售。<br>⑤ 点击主岛鸡舍或果园入口进入独立的 3D 场景，在里面直接喂鸡、收蛋、种果树和采摘。返回主岛后仍可继续种田。<br>⑥ 单指拖动平移视角，双指捏合或右侧 + / − 可放大缩小（最高 4.8×）。<br>⑦ 右侧小房子按钮恢复全景；游戏自动保存进度。<br><br>当前为手机浏览器 v0.11.0 试玩版；3D 空岛、房屋、树木等均由立体几何构成，完全离线渲染，无需加载外部 3D 素材。</div><button class="action" style="margin-top:13px" id="resetProgress">重置游戏进度</button>`;}
 $('panelBody').innerHTML=content;$('panelShade').classList.add('show');$('panel').classList.add('panelShow');}
function closePanel(){$('panelShade').classList.remove('show');$('panel').classList.remove('panelShow');openPanelName='';}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{const where=b.dataset.panel;if(where==='coop'||where==='orchard')enterScene(where);else panel(where);});$('closePanel').onclick=closePanel;$('panelShade').onclick=closePanel;
$('seedStrip').addEventListener('click',e=>{const button=e.target.closest('[data-seed]');if(!button)return;state.selected=+button.dataset.seed;save();hud();toast('🌱 选择了'+CROPS[state.selected].name)});
$('panelBody').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.buy!==undefined){state.selected=+b.dataset.buy;save();hud();toast('🌱 选择了'+CROPS[state.selected].name);closePanel();}if(b.dataset.claim!==undefined){const i=+b.dataset.claim;if(state.total>=tasks[i].need&&!state.completed.includes(i)){state.completed.push(i);state.coins+=tasks[i].reward;save();hud();toast('🎁 任务奖励 +'+tasks[i].reward+' 金币');panel('goals');}}if(b.dataset.coopAction==='feed'){feedChickens();return;}if(b.dataset.coopAction==='collect'){collectEggs();return;}if(b.dataset.coopAction==='sell'){sellEggs();return;}if(b.dataset.fruitAction==='view'){viewOrchard();return;}if(b.dataset.fruitAction==='plant'){plantFruitTree(+b.dataset.slot,+b.dataset.fruit);return;}if(b.dataset.fruitAction==='harvest'){harvestFruit(+b.dataset.slot);return;}if(b.dataset.fruitAction==='sell'){sellFruit(+b.dataset.fruit);return;}if(b.id==='resetProgress'){if(!confirm('确定清空当前农场，重新开始吗？'))return;state=initial();save();needsStatic=needsDynamic=true;drawSeeds();hud();closePanel();toast('🌼 新农场已经准备好了！');}});
$('play').onclick=()=>{$('welcome').classList.add('hide');save();};
$('sceneBack').onclick=returnIsland;
$('sceneDockBody').addEventListener('click',e=>{
 const b=e.target.closest('[data-scene-action]');if(!b)return;
 const action=b.dataset.sceneAction;
 if(action==='feed')feedChickens();else if(action==='collect')collectEggs();else if(action==='sellEggs')sellEggs();
 else if(action==='plant')plantFruitTree(+b.dataset.slot,+b.dataset.fruit);
 else if(action==='harvest')harvestFruit(+b.dataset.slot);
 else if(action==='sellFruit')sellFruit(+b.dataset.fruit);
});
let touches=new Map(),startTouch=null,moved=false,pinchOrigin=null;
canvas.addEventListener('pointerdown',e=>{
 canvas.setPointerCapture?.(e.pointerId);
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(touches.size===1){startTouch={x:e.clientX,y:e.clientY,shiftX,shiftY};moved=false;pinchOrigin=null;}
 else if(touches.size===2){
  const a=[...touches.values()];pinchOrigin={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2,shiftX,shiftY,zoom,dist:Math.max(10,Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y))};moved=true;
 }
});
canvas.addEventListener('pointermove',e=>{
 if(!touches.has(e.pointerId))return;
 touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(touches.size===2&&pinchOrigin){
  const a=[...touches.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),centerX=(a[0].x+a[1].x)/2,centerY=(a[0].y+a[1].y)/2;
  const next=clampZoom(pinchOrigin.zoom*d/pinchOrigin.dist),ratio=next/pinchOrigin.zoom;
  shiftX=(centerX-W*.5)-(pinchOrigin.x-W*.5-pinchOrigin.shiftX)*ratio;
  shiftY=(centerY-H*.49)-(pinchOrigin.y-H*.49-pinchOrigin.shiftY)*ratio;
  zoom=next;clampCamera();updateZoomBadge();moved=true;
 }else if(touches.size===1&&startTouch){
  const dx=e.clientX-startTouch.x,dy=e.clientY-startTouch.y;
  if(Math.hypot(dx,dy)>11)moved=true;
  if(moved){shiftX=startTouch.shiftX+dx;shiftY=startTouch.shiftY+dy;clampCamera();}
 }
});
function pointerEnd(e){
 if(!touches.has(e.pointerId))return;
 touches.delete(e.pointerId);
 if(touches.size===0&&startTouch&&!moved&&!openPanelName&&$('welcome').classList.contains('hide')){
  const x=e.clientX,y=e.clientY;
  if(activeScene!=='island')sceneCanvasTap(x,y);
  else{
   let tapped=false;
   for(let i=15;i>=0;i--){if(contains(x,y,screenPoly(i))){tapPlot(i,x,y);tapped=true;break;}}
   if(!tapped&&coopHit(x,y)){enterScene('coop');tapped=true;}
   if(!tapped&&orchardGateHit(x,y)){enterScene('orchard');}
  }
 }
 if(touches.size===1){const remaining=[...touches.values()][0];startTouch={x:remaining.x,y:remaining.y,shiftX,shiftY};pinchOrigin=null;moved=true;}
 else if(touches.size===0){startTouch=null;pinchOrigin=null;}
}
canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomTo(zoom*(e.deltaY>0?.90:1.11),e.clientX,e.clientY);},{passive:false});
$('cameraPlus').addEventListener('click',()=>zoomTo(zoom*1.43));
$('cameraMinus').addEventListener('click',()=>zoomTo(zoom/1.43));
$('cameraReset').addEventListener('click',()=>{if(activeScene==='island')resetCamera();else{zoom=activeScene==='coop'?1.86:1.82;centerRoomAt(0,activeScene==='coop'?-1.28:0,.8);updateZoomBadge();}});
// Countdown refreshed only when the panel is open; gameplay uses wall-clock timestamps.
setInterval(()=>{
 if(activeScene!=='island')tickSceneDock();
 if(openPanelName==='orchard'){
  let needsPanel=false;
  document.querySelectorAll('[data-orchard-timer]').forEach(el=>{
   const i=+el.dataset.orchardTimer,t=state.orchard.trees[i],left=orchardRemaining(i);
   if(t.type<0)return;
   if(left===0){
    const button=document.querySelector(`button[data-fruit-action="harvest"][data-slot="${i}"]`);
    if(button&&button.disabled)needsPanel=true;
   }else el.textContent='⏳ '+left+'秒后'+(t.harvests?'再结果':'成熟');
  });
  if(needsPanel)panel('orchard');
 }
 if(openPanelName!=='coop')return;
 const el=$('coopCountdown');if(!el)return;
 const stage=coopStage();
 if(stage==='growing')el.textContent=coopSecondsLeft()+'秒';
 else if(stage==='ready'&&el.textContent!=='可收集')panel('coop');
},1000);
window.addEventListener('resize',resize,{passive:true});canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();$('no3d').style.display='block';});
resize();drawSeeds();hud();updateZoomBadge();requestAnimationFrame(frame);
})();
</script></body></html>
