name: Cloud Farm Art V1.3 regression
on:
  push:
    branches: [art-v1-test]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  models-and-farm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check model generator syntax
        run: node --check tools/build_buildings.cjs
      - name: Regenerate editable building assets
        run: node tools/build_buildings.cjs
      - name: Confirm generated GLB and GLTF files are reproducible
        run: git diff --exit-code -- assets/art-v1
      - name: Validate loader, model geometry, game production and saved data
        run: node tests/art-v1.test.cjs
